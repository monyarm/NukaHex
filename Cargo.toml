[package]
name = "fallout_map_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
imageproc = "0.23"
rusttype = "0.9" 
sha2 = "0.10"
hex = "0.4"
steamlocate = "2.0"
lzss = "0.9"
ureq = "2.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1.0"
lazy_static = "1.4"
urlencoding = "2.1"
log = "0.4"
simplelog = "0.12"
rayon = "1.10"
zip = "0.6"
